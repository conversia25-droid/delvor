# =====================================================================
# Delvor — nginx config para SPA Vite/React
# - SPA fallback (history routes)
# - gzip + brotli leve
# - cache agressivo em assets com hash, no-cache pro index.html
# - headers de segurança básicos
# =====================================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Logs (vão pro stdout via Docker)
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/x-javascript application/json
    application/xml application/xml+rss application/rss+xml
    image/svg+xml
    font/woff2 font/woff;

  # Headers de segurança básicos
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Assets do Vite têm hash no nome — cache forte e eterno.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Imagens / fontes / favicons — cache de 7 dias.
  location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # index.html: NUNCA cacheia (pra atualizações imediatas).
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    expires off;
  }

  # SPA fallback: qualquer rota não-encontrada cai no index.html
  # (necessário porque o React Router usa pushState).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bloqueia arquivos sensíveis comuns.
  location ~ /\.(?!well-known).* {
    deny all;
    access_log off;
    log_not_found off;
  }
}
