<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="white" opacity="0.03"/>
  <circle cx="1100" cy="100" r="250" fill="white" opacity="0.03"/>
  <circle cx="900" cy="500" r="150" fill="white" opacity="0.02"/>

  <!-- Decorative lines -->
  <line x1="0" y1="0" x2="400" y2="630" stroke="white" stroke-width="1" opacity="0.05"/>
  <line x1="200" y1="0" x2="600" y2="630" stroke="white" stroke-width="1" opacity="0.05"/>
  <line x1="800" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1" opacity="0.05"/>

  <!-- Logo text -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="6">
    INFQNITY
  </text>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="url(#accent)" font-weight="500" letter-spacing="8">
    LEADS CRM
  </text>

  <!-- Divider -->
  <rect x="450" y="345" width="300" height="2" rx="1" fill="white" opacity="0.3"/>

  <!-- Description -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" opacity="0.85">
    O CRM com IA para Escalar seu Negocio
  </text>

  <!-- Features -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white" opacity="0.5">
    WhatsApp Integrado  |  Leads Ilimitados  |  Inteligencia Artificial
  </text>

  <!-- Bottom URL bar -->
  <rect x="0" y="580" width="1200" height="50" fill="black" opacity="0.2"/>
  <text x="600" y="612" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white" opacity="0.6">
    infnityleads.com.br
  </text>
</svg>
